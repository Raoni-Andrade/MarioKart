<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Kart</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">

    <script defer src="./script.js"></script>

    <audio id="audioWinner" src="./files/marioWinner.mp3"></audio>
</head>

<body>
    <header>
        <h1><img src="./files/corridaMaravilhosa.png" alt="Awesome Race"></h1>
    </header>

    <div class="selectPlayer">
        <p>SELECT YOUR PLAYER:</p>
        <p class="small">Click on the question mark [?], then on the character.</p>
    </div>

    <section id="characters" class="alternatives">
        <img src="files/mario.png" alt="Mario" class="playersImages">
        <img src="files/luigi.png" alt="Luigi" class="playersImages">
        <img src="files/peach.png" alt="Peach" class="playersImages">
        <img src="files/yoshi.png" alt="Yoshi" class="playersImages">
    </section>

    <button id="start-race-btn" class="btn-go">GO!</button>
    <button id="reset-race-btn" class="btn-reset">RESET</button>

    <section class="players">
        <div id="player1" class="car"></div>
        <div id="player2" class="car"></div>
    </section>
</body>

</html>
